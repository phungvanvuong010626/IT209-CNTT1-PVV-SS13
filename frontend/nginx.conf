# Cấu hình nginx cho frontend: phục vụ bản build tĩnh và proxy API tới backend.
server {
    listen 80;
    server_name _;

    # Ẩn phiên bản nginx trong header phản hồi.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Giới hạn kích thước body của yêu cầu.
    client_max_body_size 2m;

    # Nén gzip cho các tài nguyên văn bản.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Chuyển tiếp API tới backend (tên dịch vụ trong Docker Compose).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check của backend, dùng cho CD và giám sát bên ngoài.
    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tệp tĩnh có hash trong tên: cache lâu dài.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html không cache để luôn nhận bản mới sau mỗi lần triển khai.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: mọi đường dẫn khác trả về index.html.
    location / {
        try_files $uri /index.html;
    }
}
